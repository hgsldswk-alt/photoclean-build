name: PhotoClean
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.photoclean
    APP_STORE_ID: "6835040441"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PhotoClean:
    type: application
    platform: iOS
    sources:
      - PhotoClean
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"  # XcodeGen 默认 1,2 会盖掉项目级设置，必须写在 target 上
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PhotoClean AppStore
    info:
      path: PhotoClean/Info.plist
      properties:
        CFBundleDisplayName: 相册清理
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 用来在手机上找出相似照片、截图和大视频，帮你整理和删除。照片只在本机处理，不会上传。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.photoclean
            CFBundleURLSchemes: [photoclean]
        PhotoCleanAppGroup: group.$(APP_ID)
        PhotoCleanProProductID: $(APP_ID).pro
        APP_STORE_ID: $(APP_STORE_ID)
    entitlements:
      path: PhotoClean/PhotoClean.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
    dependencies:
      - target: PhotoCleanWidget
  PhotoCleanWidget:
    type: app-extension
    platform: iOS
    sources:
      - PhotoCleanWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"  # XcodeGen 默认 1,2 会盖掉项目级设置，必须写在 target 上
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PhotoClean Widget AppStore
    info:
      path: PhotoCleanWidget/Info.plist
      properties:
        CFBundleDisplayName: 相册清理
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PhotoCleanAppGroup: group.$(APP_ID)
    entitlements:
      path: PhotoCleanWidget/PhotoCleanWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
  PhotoCleanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoCleanTests
      - Shared
      - PhotoClean/DemoSceneRenderer.swift
      - PhotoClean/Design.swift
      - PhotoClean/ShareCard.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  PhotoCleanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhotoCleanUITests
    dependencies:
      - target: PhotoClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoClean
schemes:
  PhotoClean:
    build:
      targets:
        PhotoClean: all
        PhotoCleanTests: [test]
    test:
      config: Debug
      targets: [PhotoCleanTests]
  PhotoCleanUI:
    build:
      targets:
        PhotoClean: all
        PhotoCleanUITests: [test]
    test:
      config: Debug
      targets: [PhotoCleanUITests]
